

<div class="page-header">

    <h2>Students</h2>

    <button
        mat-raised-button
        color="primary"
        (click)="openStudentFormDialog()">
        Add Student

    </button>

</div>
@if (loading()) {

    <div class="loading-container">
        <mat-spinner diameter="50"></mat-spinner>

        <p>Loading students...</p>
    </div>

} @else{

<table mat-table [dataSource]="students() || []">

   @for(column of displayedColumns;track column){
        <ng-container [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef> {{column}}</th>
        <td mat-cell *matCellDef="let student">
            @if(column === 'actions'){
                <button mat-button (click)="editStudent(student.id, student)">Edit</button>
                <button mat-button color="warn" (click)="deleteStudent(student.id)">Delete</button>
            }@else{
                {{student[column]}}
            }
        </td>
    </ng-container>
    }


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row;columns : displayedColumns"></tr>

</table>
}
